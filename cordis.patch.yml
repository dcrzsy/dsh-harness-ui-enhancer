# Harness UI Enhancer bundle patch.
# 1. Mount the enhancer plugin itself.
# 2. Disable the bundled first-prompt session-title provider; this plugin
#    registers an all-prompts + created-at-suffix provider instead
#    (restate-override: later patch rows win per id).
- insert:
    - id: ui-enhancer
      name: dsh-enhance-tool
- id: session-title-llm
  disabled: true
